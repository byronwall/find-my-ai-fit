<!--
  THESIS: The share card is a compact opportunity map, not a generic AI promise.
  OWN-WORLD: Cool paper, structural ink, electric periwinkle, citrus selection, crisp offset depth.
  STORY: Bring your work, scan a tailored 3×3 map, mark what fits, leave with one practical next step.
  FIRST VIEWPORT: Brand and promise lead on the left; the real grid mechanism fills the right; the CTA anchors the bottom.
  FORM: Established strategy-studio world, distilled into a single 1200×630 social artifact.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Find My AI Fit</title>
  <desc id="description">Find practical AI opportunities tailored to your work and turn one into a next step.</desc>

  <rect width="1200" height="630" fill="#f3f5fb"/>
